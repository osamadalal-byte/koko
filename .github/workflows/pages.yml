name: Test and publish FORM 28
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: form28-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: npm run test:browser
      - run: npm run build
      - run: node tests/check-preview.cjs
      - run: npm run test:dist
      - name: Verify reviewed human videos before publication
        run: npm run test:video-release
      - name: Verify current provider playback before publication
        run: node scripts/audit-inline-videos.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested app
        id: deployment
        uses: actions/deploy-pages@v4

  verify_deployment:
    needs: deploy
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Verify deployed bytes, HTTPS, app flow and offline cache
        run: node tests/verify-published.cjs
      - name: Play all demonstrations on the live origin
        env:
          FORM28_AUDIT_URL: https://osamadalal-byte.github.io/koko/
        run: node scripts/audit-inline-videos.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-app-verification
          path: test-results/
